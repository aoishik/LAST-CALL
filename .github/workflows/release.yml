name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --onefile --console `
            --icon "LAST_CALL.ico" `
            --hidden-import "pyfiglet" `
            --hidden-import "rich" `
            --hidden-import "questionary" `
            --collect-submodules "questionary" `
            --collect-submodules "rich" `
            --collect-submodules "pyfiglet" `
            --collect-all "pyfiglet" `
            --collect-all "rich" `
            --collect-all "questionary" `
            "main.py"

      - name: Rename executable
        run: Rename-Item dist\main.exe LAST-CALL-Windows-x64.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAST-CALL-Windows-x64
          path: dist/LAST-CALL-Windows-x64.exe


  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux executable
        run: |
          pyinstaller --noconfirm --onefile --console \
            --hidden-import "pyfiglet" \
            --hidden-import "rich" \
            --hidden-import "questionary" \
            --collect-submodules "questionary" \
            --collect-submodules "rich" \
            --collect-submodules "pyfiglet" \
            --collect-all "pyfiglet" \
            --collect-all "rich" \
            --collect-all "questionary" \
            "main.py"

      - name: Rename executable
        run: mv dist/main dist/LAST-CALL-Linux-x64

      - name: Make executable
        run: chmod +x dist/LAST-CALL-Linux-x64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAST-CALL-Linux-x64
          path: dist/LAST-CALL-Linux-x64


  release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-linux

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: LAST-CALL-Windows-x64
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: LAST-CALL-Linux-x64
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LAST CALL ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/LAST-CALL-Windows-x64.exe
            release/LAST-CALL-Linux-x64